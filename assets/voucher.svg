<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 104" width="260" height="104" role="img" aria-label="Jerry 网页调度券">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.14"/>
    </filter>
    <!-- 底部蓝条：横向渐变，左深右浅 -->
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A6FB5"/>
      <stop offset="1" stop-color="#2BB3ED"/>
    </linearGradient>
  </defs>

  <!-- 白卡（圆角 + 柔和投影） -->
  <rect x="3" y="3" width="254" height="98" rx="20" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" filter="url(#soft)"/>

  <!-- 左侧两根灰色竖列（#C9C9C9，缩至约 2/3；左缘对齐底条左缘 x=18，顶端对齐右蓝条顶端 y=14） -->
  <rect x="18" y="14" width="11" height="48" rx="4" fill="#C9C9C9"/>
  <rect x="33" y="14" width="9" height="48" rx="4" fill="#C9C9C9"/>

  <!-- 底部蓝条（圆角，左深右浅渐变） -->
  <rect x="18" y="82" width="188" height="16" rx="8" fill="url(#bar)"/>

  <!-- 右侧蓝竖条（圆角） + 竖排字（文字靠右，与原草图一致） -->
  <rect x="214" y="14" width="32" height="76" rx="11" fill="#18ACEA"/>
  <text x="238" y="52" transform="rotate(-90 238 52)" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Segoe UI,Roboto,sans-serif"
        font-size="6.4" font-weight="700" letter-spacing="0.2" fill="#FFFFFF">Jerry's webpage</text>
</svg>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全站搜索 · 小蓝页</title>
<meta property="og:title" content="全站搜索 · 小蓝页" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../common.css?v=20261103a" />

  <style>
    :root{--bg:#f6f8fc;--card:#fff;--bd:#e3e8f0;--tx:#222;--mu:#6b7280;--ac:#2f6fed}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
    header{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
    header a{color:var(--ac);text-decoration:none}header h1{font-size:1.5rem;margin:0;flex:1}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
    input[type=text],select{padding:10px 12px;border:1px solid var(--bd);border-radius:9px;font:inherit;background:var(--card);color:var(--tx)}
    button{padding:9px 16px;border:1px solid var(--bd);border-radius:9px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
    button.ghost{background:transparent;color:var(--ac)}
    ul{list-style:none;padding:0;margin:0}li{padding:12px 0;border-bottom:1px solid var(--bd)}
    li:last-child{border:0}.tag{display:inline-block;font-size:12px;background:rgba(47,111,237,.1);color:var(--ac);border-radius:6px;padding:1px 7px;margin-right:8px}
    .muted{color:var(--mu);font-size:.9rem}a.res{color:var(--tx);text-decoration:none;font-weight:600}
    a.res:hover{color:var(--ac)}footer{text-align:center;color:var(--mu);font-size:.9rem;margin-top:30px}
    @media(prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1d2027;--bd:#32363f;--tx:#eee;--mu:#9aa1ad}}
  </style>
</head><body><div class="wrap">

<header><a href="../">← 返回小蓝页</a><h1>全站搜索</h1></header>
<div class="card">
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <input type="text" id="q" placeholder="搜索茶馆帖子、片屿视频、书栈藏书、音乐曲目、每日要闻…" style="flex:1;min-width:240px" />
    <select id="site">
      <option value="">全部站点</option><option value="teahouse">茶馆</option>
      <option value="pianyu">片屿</option><option value="bookstation">书栈</option>
      <option value="music">音乐电台</option><option value="news">每日要闻</option>
    </select>
    <button id="go">搜索</button>
  </div>
  <p class="muted" id="meta" style="margin:12px 0 0">数据来自 5 个站点的公开接口，5 分钟缓存。</p>
</div>
<div class="card"><ul id="list"><li class="muted">输入关键词开始搜索，或留空查看最新全站动态。</li></ul></div>

<footer><span class="uikit-foot"><a href="../sitemap.xml">站点地图</a> · <a href="/feed.xml">RSS 订阅</a></span><br>© 2026 Jerry · <a href="../">小蓝页</a></footer>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
  function run(){
    var q=$('q').value.trim(), site=$('site').value;
    $('meta').textContent='搜索中…';
    fetch('/api/globalsearch?q='+encodeURIComponent(q)+'&site='+encodeURIComponent(site),{credentials:'same-origin'})
      .then(function(r){return r.json()}).then(function(d){
        $('meta').textContent='共 '+d.total+' 条结果'+(d.cached?'（缓存）':'')+(d.errors&&d.errors.length?' · 暂不可用：'+d.errors.join('、'):'');
        var l=$('list');l.innerHTML='';
        if(!d.items||!d.items.length){l.innerHTML='<li class="muted">没有找到匹配内容。</li>';return}
        d.items.forEach(function(x){
          var li=document.createElement('li');
          li.innerHTML='<a class="res" target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.title)+'</a>'+
            '<div class="muted"><span class="tag">'+esc(x.label)+' · '+esc(x.kind)+'</span>'+esc(x.desc)+'</div>';
          l.appendChild(li);
        });
      }).catch(function(){$('meta').textContent='搜索失败，请稍后重试。'});
  }
  $('go').addEventListener('click',run);
  $('q').addEventListener('keydown',function(e){if(e.key==='Enter')run()});
  var u=new URL(location.href);$('q').value=u.searchParams.get('q')||'';run();
})();
</script>

<script src="../assets/ui-kit.js?v=20261109a" data-uikit="lazy,keys,skeleton,sw"></script>
</body></html>

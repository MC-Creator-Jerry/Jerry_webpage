  .content { max-width: 920px; margin: 0 auto; padding: 56px 24px 64px; }

  .hero p { font-size: 1.02rem; line-height: 1.7; color: var(--muted); max-width: 680px; }

  .card {
    margin-top: 22px; background: var(--card-bg); border: 1px solid var(--card-border);

  }
  .card h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 14px; }

  /* 留言表单 */
  .gb-form { display: flex; flex-direction: column; gap: 12px; }
  .gb-row { display: flex; flex-direction: column; gap: 6px; }
  .gb-label { font-size: 0.88rem; color: var(--muted); }
  .gb-input, .gb-textarea {
    width: 100%; border: 1px solid var(--card-border); border-radius: 10px;
    background: var(--bg); color: var(--text); padding: 10px 12px; font-size: 1rem;
    font-family: inherit;
  }
  .gb-input:focus, .gb-textarea:focus { outline: none; border-color: var(--accent); }
  .gb-textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
  .gb-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .gb-count { font-size: 0.82rem; color: var(--muted); }
  .gb-count.over { color: #d13438; font-weight: 700; }
  .gb-submit {
    align-self: flex-start; background: var(--accent); color: #fff; border: none;
    border-radius: 999px; padding: 10px 24px; font-size: 1rem; font-weight: 700; cursor: pointer;

  .gb-submit:hover { background: #005a9e; }
  .gb-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .gb-note { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .gb-hint-bad { color: #d13438; }

  /* 留言列表 */
  .gb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .gb-item {
    background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius);

  .gb-item-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .gb-name { font-weight: 700; color: var(--text); font-size: 0.98rem; }
  .gb-time { font-size: 0.78rem; color: var(--muted); }
  .gb-msg { font-size: 0.98rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .gb-empty { color: var(--muted); font-size: 0.95rem; line-height: 1.7; }

  @media (max-width: 560px) {

    .hero h1 { font-size: 1.6rem; }
    .card { padding: 18px; }
    .gb-submit { width: 100%; }
  }
  [hidden] { display: none !important; }

  <div id="gbToast" style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:0.95rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;"></div>

  <script>
    (function () {
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fmtTime(ts) {
        try {
          var d = new Date(ts);
          if (isNaN(d.getTime())) return '';
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') +
            ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        } catch (e) { return ''; }
      }
      function toast(msg, bad) {
        var t = document.getElementById('gbToast');
        t.textContent = msg;
        t.style.background = bad ? '#d13438' : 'var(--text)';
        t.style.color = bad ? '#fff' : 'var(--bg)';
        t.style.opacity = '1';
        t.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(window.__gbToast);
        window.__gbToast = setTimeout(function () {
          t.style.opacity = '0';
          t.style.transform = 'translateX(-50%) translateY(20px)';
        }, 2600);
      }

      var nameEl = document.getElementById('gbName');
      var msgEl = document.getElementById('gbMsg');
      var countEl = document.getElementById('gbCount');
      var submitEl = document.getElementById('gbSubmit');
      var hintEl = document.getElementById('gbHint');
      var listEl = document.getElementById('gbList');
      var emptyEl = document.getElementById('gbEmpty');

      function updateCount() {
        var len = msgEl.value.length;
        countEl.textContent = len + ' / 800';
        countEl.classList.toggle('over', len > 800);
      }
      msgEl.addEventListener('input', updateCount);

      function renderList(items) {
        listEl.innerHTML = '';
        if (!items || !items.length) { emptyEl.hidden = false; return; }
        emptyEl.hidden = true;
        items.forEach(function (it) {
          var li = document.createElement('li');
          li.className = 'gb-item';
          var head = document.createElement('div');
          head.className = 'gb-item-head';
          var nm = document.createElement('span');
          nm.className = 'gb-name';
          nm.textContent = it.name || '匿名访客';
          var tm = document.createElement('span');
          tm.className = 'gb-time';
          tm.textContent = fmtTime(it.ts);
          head.appendChild(nm);
          head.appendChild(tm);
          var msg = document.createElement('div');
          msg.className = 'gb-msg';
          msg.textContent = it.message || '';   // textContent：天然防 XSS
          li.appendChild(head);
          li.appendChild(msg);
          listEl.appendChild(li);
        });
      }

      function loadList() {
        fetch('../api/guestbook')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d && d.ok && Array.isArray(d.list)) renderList(d.list);
            else emptyEl.hidden = false;
          })
          .catch(function () { emptyEl.hidden = false; });
      }

      document.getElementById('gbForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var message = msgEl.value.trim();
        var name = nameEl.value.trim();
        if (!message) { toast('留言内容不能为空', true); return; }
        if (message.length > 800) { toast('留言太长（≤800 字）', true); return; }
        submitEl.disabled = true;
        fetch('../api/guestbook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, message: message })
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d && d.ok) {
              msgEl.value = '';
              updateCount();
              toast('已发布，感谢留言！');
              loadList();
            } else if (d && d.error === 'forbidden') {
              toast('包含违禁词「' + (d.word || '') + '」，请修改后重试', true);
            } else if (d && d.error === 'rate_limited') {
              toast('留言太快了，请稍后再试', true);
            } else {
              toast(d && d.error ? ('发布失败：' + d.error) : '发布失败，请重试', true);
            }
          })
          .catch(function () { toast('网络错误，请稍后重试', true); })
          .finally(function () { submitEl.disabled = false; });
      });

      // 占位符随语言切换（与全站 applyLang 兼容）
      function applyPh() {
        var en = (localStorage.getItem('xl_lang') || 'zh') === 'en';
        nameEl.placeholder = en ? 'Defaults to “Anonymous”' : '不填则显示「匿名访客」';
        msgEl.placeholder = en ? 'Say something… (max 800 chars)' : '说点什么吧…（最多 800 字）';
      }
      window.addEventListener('storage', function (e) { if (e.key === 'xl_lang') applyPh(); });
      applyPh();
      updateCount();
      loadList();
    })();
  </script>

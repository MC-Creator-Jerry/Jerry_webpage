  .bar-left { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
  .site-name {

    font-weight: 700;
    letter-spacing: 0.3px;

    text-decoration: none;
    cursor: pointer;

  .site-name:hover { opacity: 0.9; }
  .breadcrumb {

  .bar-right { display: flex; align-items: center; gap: 8px; }
  .bar-btn {

    background: rgba(255, 255, 255, 0.08);
    color: var(--bar-fg);
    border-radius: 0;
    padding: 6px 11px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    line-height: 1;

  .card {

  .empty-tip {

  /* ---- 页脚 ---- */

  <script>
    (function () {
      var K = { lang: 'xl_lang', theme: 'xl_theme', font: 'xl_font', radius: 'xl_radius' };
      function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }

      var cur = {
        lang: get(K.lang, 'zh'),
        theme: get(K.theme, 'light'),
        font: get(K.font, '1'),
        radius: get(K.radius, '14')
      };

      function applyTheme() { document.documentElement.setAttribute('data-theme', cur.theme); }
      function applyFont() { document.documentElement.style.setProperty('--font-scale', cur.font); }
      function applyRadius() { document.documentElement.style.setProperty('--radius', cur.radius + 'px'); }
      function applyLang() {
        var en = cur.lang === 'en';
        document.documentElement.lang = en ? 'en' : 'zh-CN';
        var nodes = document.querySelectorAll('[data-zh]');
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          var txt = en ? (n.getAttribute('data-en') || n.textContent) : n.getAttribute('data-zh');
          if (txt != null) n.textContent = txt;
        }
      }
      function applyAll() { applyTheme(); applyFont(); applyRadius(); applyLang(); }
      applyAll();
    })();
  </script>

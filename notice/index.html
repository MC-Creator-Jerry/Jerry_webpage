  <script>
    (function () {
      var FORBIDDEN = ['fuck','shit','bitch','asshole','bastard','dick','cunt','whore','slut','nigger','faggot','retard','tranny','nazi','kill yourself','kys','傻逼','sb','草泥马','操你','日你','妈的','贱人','婊子','杂种','滚蛋','废青','支那','洋奴','汉奸','狗杂种','加微信','扫码领','免费送','刷单','博彩','赌博','色情','裸聊','办证','代开发票','点击领取','一元购','日赚','月入过万','私聊客服'];
      function findForbidden(t){ if(!t) return null; var low=String(t).toLowerCase(); for(var i=0;i<FORBIDDEN.length;i++){ if(low.indexOf(FORBIDDEN[i].toLowerCase())!==-1) return FORBIDDEN[i]; } return null; }

      var toastEl = document.getElementById('toast');
      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }
      function fmtTime(ts) {
        try { return new Date(ts).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
      }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

      var data = { system: [], messages: [], comments: [], unread: { system: 0, message: 0, comment: 0 } };
      var isAdmin = false;
      var currentTab = 'system';

      function refreshBadges() {
        function setBadge(el, n) { if (n > 0) { el.textContent = n > 99 ? '99+' : String(n); el.hidden = false; } else { el.hidden = true; } }
        setBadge(document.getElementById('tbSystem'), data.unread.system);
        setBadge(document.getElementById('tbMessage'), data.unread.message);
        setBadge(document.getElementById('tbComment'), data.unread.comment);
        if (window.JW_REFRESH_BADGE) window.JW_REFRESH_BADGE();
      }

      function markSeen(type) {
        fetch('/api/notif/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: type }) })
          .then(function () { data.unread[type] = 0; refreshBadges(); })
          .catch(function () {});
      }

      function renderSystem() {
        var el = document.getElementById('listSystem');
        var empty = document.getElementById('emptySystem');
        el.innerHTML = '';
        if (!data.system.length) { empty.hidden = false; return; }
        empty.hidden = true;
        data.system.forEach(function (n) {
          var card = document.createElement('div'); card.className = 'notice';
          var del = isAdmin ? '<button class="del" data-id="' + n.id + '">删除</button>' : '';
          card.innerHTML = del + '<h3></h3><div class="meta"></div><p></p>';
          var h3 = card.querySelector('h3');
          h3.textContent = n.title || '（无标题）';
          if (n.permanent === false) { var t1 = document.createElement('span'); t1.className = 'temp-tag'; t1.textContent = '暂时'; h3.appendChild(t1); }
          card.querySelector('.meta').textContent = fmtTime(n.ts);
          card.querySelector('p').textContent = n.body || '';
          if (isAdmin) card.querySelector('.del').addEventListener('click', function () { delNotice(n.id); });
          el.appendChild(card);
        });
      }

      function renderMessage() {
        var el = document.getElementById('listMessage');
        var empty = document.getElementById('emptyMessage');
        var need = document.getElementById('needLoginMsg');
        el.innerHTML = '';
        if (!window.JW_AUTH || !window.JW_AUTH.user) { empty.hidden = true; need.hidden = false; return; }
        need.hidden = true;
        if (!data.messages.length) { empty.hidden = false; return; }
        empty.hidden = true;
        data.messages.forEach(function (m) {
          var card = document.createElement('div'); card.className = 'msg';
          card.innerHTML =
            '<div class="from"></div><h3></h3><p></p><div class="time"></div>';
          card.querySelector('.from').textContent = '来自 @' + (m.from || '系统');
          card.querySelector('h3').textContent = m.title || '（无标题）';
          if (m.permanent === false) { var t2 = document.createElement('span'); t2.className = 'temp-tag'; t2.textContent = '暂时'; card.querySelector('h3').appendChild(t2); }
          card.querySelector('p').textContent = m.body || '';
          card.querySelector('.time').textContent = fmtTime(m.ts);
          el.appendChild(card);
        });
      }

      function renderComment() {
        var el = document.getElementById('listComment');
        var empty = document.getElementById('emptyComment');
        var need = document.getElementById('needLoginCmt');
        el.innerHTML = '';
        if (!window.JW_AUTH || !window.JW_AUTH.user) { empty.hidden = true; need.hidden = false; return; }
        need.hidden = true;
        if (!data.comments.length) { empty.hidden = false; return; }
        empty.hidden = true;
        data.comments.forEach(function (c) {
          var card = document.createElement('div'); card.className = 'cmt-notif';
          var ico = c.type === 'mention' ? '📣' : (c.type === 'reply' ? '↩️' : '💬');
          var txt;
          if (c.type === 'mention') txt = '<a href="../post/detail/?post=' + encodeURIComponent(c.postId) + '">@' + esc(c.fromLogin) + '</a> 在评论中 @ 了你';
          else if (c.type === 'reply') txt = '<a href="../post/detail/?post=' + encodeURIComponent(c.postId) + '">@' + esc(c.fromLogin) + '</a> 回复了你的评论';
          else txt = '<a href="../post/detail/?post=' + encodeURIComponent(c.postId) + '">@' + esc(c.fromLogin) + '</a> 评论了你的帖子《' + esc(c.postTitle) + '》';
          card.innerHTML =
            '<div class="ico">' + ico + '</div>' +
            '<div class="main">' +
              '<div class="title">' + txt + '</div>' +
              (c.text ? '<div class="snippet"></div>' : '') +
              '<div class="time"></div>' +
            '</div>';
          if (c.text) card.querySelector('.snippet').textContent = c.text;
          card.querySelector('.time').textContent = fmtTime(c.ts);
          el.appendChild(card);
        });
      }

      function load() {
        fetch('/api/notif')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (!d) return;
            data.system = d.system || [];
            data.messages = d.messages || [];
            data.comments = d.comments || [];
            data.unread = d.unread || { system: 0, message: 0, comment: 0 };
            isAdmin = !!(window.JW_AUTH && window.JW_AUTH.isAdmin);
            if (isAdmin) { document.getElementById('adminPanel').hidden = false; document.getElementById('msgAdminPanel').hidden = false; }
            var loggedIn = !!(window.JW_AUTH && window.JW_AUTH.user);
            ['System', 'Message', 'Comment'].forEach(function (k) { document.getElementById('tools' + k).hidden = !loggedIn; });
            renderSystem(); renderMessage(); renderComment(); refreshBadges();
          })
          .catch(function () {});
      }

      // 切换标签
      function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-tab') === tab); });
        document.getElementById('panelSystem').hidden = tab !== 'system';
        document.getElementById('panelMessage').hidden = tab !== 'message';
        document.getElementById('panelComment').hidden = tab !== 'comment';
        document.getElementById('panelDm').hidden = tab !== 'dm';
        if (data.unread[tab] > 0) markSeen(tab);
      }
      document.querySelectorAll('.tab').forEach(function (t) {
        t.addEventListener('click', function () { switchTab(t.getAttribute('data-tab')); });
      });
      // 每个分类右上角：全部标为已读 + 清除所有
      function clearAll(type) {
        if (!window.JW_AUTH || !window.JW_AUTH.user) { toast('请先登录', true); return; }
        if (!confirm('确定清除该分类下的所有通知？')) return;
        fetch('/api/notif/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: type, action: 'clear' }) })
          .then(function (r) { if (r.ok) { load(); toast('已清除 ✓'); } else { throw new Error('fail'); } })
          .catch(function () { toast('清除失败', true); });
      }
      document.querySelectorAll('[data-read]').forEach(function (b) {
        b.addEventListener('click', function () { markSeen(b.getAttribute('data-read')); });
      });
      document.querySelectorAll('[data-clear]').forEach(function (b) {
        b.addEventListener('click', function () { clearAll(b.getAttribute('data-clear')); });
      });

      // 站长消息：发布 / 删除
      function postNotice() {
        var title = document.getElementById('nTitle').value.trim();
        var body = document.getElementById('nBody').value.trim();
        if (!title && !body) { toast('标题和内容不能都为空', true); return; }
        var w = findForbidden(title) || findForbidden(body);
        if (w) { toast('含违禁词：「' + w + '」', true); return; }
        var nType = document.querySelector('input[name="nType"]:checked');
        var permanent = !nType || nType.value !== 'temp';
        fetch('/api/notice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, body: body, permanent: permanent }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            if (res.ok) { document.getElementById('nTitle').value = ''; document.getElementById('nBody').value = ''; toast('已发布 ✓'); load(); }
            else if (res.body && res.body.error === 'forbidden') { toast('服务器拦截：含违禁词「' + (res.body.word || '') + '」', true); }
            else { toast('发布失败', true); }
          })
          .catch(function () { toast('发布失败（网络错误）', true); });
      }
      function delNotice(id) {
        if (!confirm('确定删除这条通知？')) return;
        fetch('/api/notice?id=' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function () { load(); })
          .catch(function () { toast('删除失败', true); });
      }
      document.getElementById('postBtn').addEventListener('click', postNotice);

      // 系统消息：发送（管理员）
      function sendMessage() {
        var to = document.getElementById('mTo').value.trim();
        var title = document.getElementById('mTitle').value.trim();
        var body = document.getElementById('mBody').value.trim();
        if (!to) { toast('请填写接收者用户名', true); return; }
        if (!title && !body) { toast('标题和内容不能都为空', true); return; }
        var w = findForbidden(title) || findForbidden(body);
        if (w) { toast('含违禁词：「' + w + '」', true); return; }
        var mType = document.querySelector('input[name="mType"]:checked');
        var permanent = !mType || mType.value !== 'temp';
        fetch('/api/notif/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: to, title: title, body: body, permanent: permanent }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            if (res.ok) { document.getElementById('mTo').value=''; document.getElementById('mTitle').value=''; document.getElementById('mBody').value=''; toast('已发送给 @' + to + ' ✓'); load(); }
            else if (res.body && res.body.error === 'forbidden') { toast('服务器拦截：含违禁词「' + (res.body.word || '') + '」', true); }
            else if (res.body && res.body.error === 'missing_to') { toast('请填写接收者', true); }
            else { toast('发送失败', true); }
          })
          .catch(function () { toast('发送失败（网络错误）', true); });
      }
      document.getElementById('msgSendBtn').addEventListener('click', sendMessage);

      // 进入页面即尝试登录态（用于判断管理员 / 显示定向通知）
      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.login) { window.JW_AUTH = window.JW_AUTH || {}; window.JW_AUTH.user = me; window.JW_AUTH.isAdmin = !!me.isAdmin; }
        load();
        // 默认标签：优先展示有未读的分类
        var first = data.unread.comment > 0 ? 'comment' : (data.unread.message > 0 ? 'message' : 'system');
        // 等 load 完成后再切（load 是异步，简单延时）
        setTimeout(function () { switchTab(first); }, 350);
      }).catch(load);
    })();
  </script>

  <script>
    (function () {
      var K = { lang: 'xl_lang', theme: 'xl_theme', font: 'xl_font', radius: 'xl_radius' };
      function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
      function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      var cur = {
        lang: get(K.lang, 'zh'),
        theme: get(K.theme, 'light'),
        font: get(K.font, '1'),
        radius: get(K.radius, '14')
      };

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', cur.theme);
      }
      function applyFont() {
        document.documentElement.style.setProperty('--font-scale', cur.font);
      }
      function applyRadius() {
        document.documentElement.style.setProperty('--radius', cur.radius + 'px');
      }
      function applyLang() {
        var en = cur.lang === 'en';
        document.documentElement.lang = en ? 'en' : 'zh-CN';
        var nodes = document.querySelectorAll('[data-zh]');
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          var txt = en ? (n.getAttribute('data-en') || n.textContent) : n.getAttribute('data-zh');
          if (txt != null) n.textContent = txt;
        }
        // 搜索框占位符双语
        var ph = document.querySelectorAll('[data-zh-ph]');
        for (var j = 0; j < ph.length; j++) {
          var p = ph[j];
          var v = en ? (p.getAttribute('data-en-ph') || '') : (p.getAttribute('data-zh-ph') || '');
          if (v) p.placeholder = v;
        }
      }
      function applyAll() { applyTheme(); applyFont(); applyRadius(); applyLang(); }

      applyAll();
    })();
  </script>
  <script>
    (function () {
      var input = document.getElementById('helpSearch');
      var grid = document.querySelector('.help-prod-grid');
      var empty = document.getElementById('searchEmpty');
      if (!input || !grid) return;

      function getTerm() {
        return (input.value || '').toLowerCase().replace(/\s+/g, '');
      }

      function matchBtn(btn, term) {
        if (!term) return true;
        var zh = (btn.getAttribute('data-zh') || '').toLowerCase();
        var en = (btn.getAttribute('data-en') || '').toLowerCase();
        var text = (btn.textContent || '').toLowerCase();
        return zh.indexOf(term) !== -1 || en.indexOf(term) !== -1 || text.indexOf(term) !== -1;
      }

      function filter() {
        var term = getTerm();
        var btns = grid.querySelectorAll('.help-prod-btn');
        var visible = 0;
        for (var i = 0; i < btns.length; i++) {
          var show = matchBtn(btns[i], term);
          btns[i].hidden = !show;
          if (show) visible++;
        }
        if (empty) {
          empty.hidden = visible > 0;
          var en = document.documentElement.lang === 'en';
          empty.textContent = en ? (empty.getAttribute('data-en') || 'No matching products found') : (empty.getAttribute('data-zh') || '未找到匹配的产品');
        }
      }

      input.addEventListener('input', filter);
      input.addEventListener('keyup', filter);
      filter();
    })();
  </script>

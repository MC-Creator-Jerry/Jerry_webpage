  <script src="../../auth.js"></script>
  <script>
    (function () {
      var listEl = document.getElementById('list');
      var emptyEl = document.getElementById('empty');
      var toastEl = document.getElementById('toast');
      var meLogin = null;
      var meIsAdmin = false;

      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }
      function fmtTime(ts) {
        try { return new Date(ts).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
      }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

      function render(posts) {
        listEl.innerHTML = '';
        if (!posts.length) { emptyEl.hidden = false; return; }
        emptyEl.hidden = true;
        posts.forEach(function (p) {
          var card = document.createElement('div'); card.className = 'post';
          var avatar = 'https://github.com/' + encodeURIComponent(p.login) + '.png';
          var canDel = meIsAdmin || (meLogin && p.login === meLogin);
          var del = canDel ? '<button class="del" data-id="' + p.id + '">删除</button>' : '';
          card.innerHTML =
            '<div class="head">' +
              '<img class="avatar" src="' + avatar + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
              '<a class="author" href="../../personal_profile/?user=' + encodeURIComponent(p.login) + '">@' + esc(p.login) + '</a>' +
              '<span class="meta">' + fmtTime(p.ts) + '</span>' +
            '</div>' +
            '<h3></h3><p></p>' + del;
          card.querySelector('h3').textContent = p.title || '（无标题）';
          card.querySelector('p').textContent = p.body || '';
          if (canDel) {
            card.querySelector('.del').addEventListener('click', function () { delPost(p.id); });
          }
          listEl.appendChild(card);
        });
      }

      function load() {
        fetch('/api/post')
          .then(function (r) { return r.ok ? r.json() : { posts: [] }; })
          .then(function (d) { render(d.posts || []); })
          .catch(function () { render([]); });
      }

      function delPost(id) {
        if (!confirm('确定删除这条帖子？')) return;
        fetch('/api/post?id=' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) { if (res.ok) { toast('已删除 ✓'); load(); } else { toast('删除失败', true); } })
          .catch(function () { toast('删除失败（网络错误）', true); });
      }

      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.login) { meLogin = me.login; meIsAdmin = !!me.isAdmin; }
        load();
      }).catch(load);
    })();
  </script>

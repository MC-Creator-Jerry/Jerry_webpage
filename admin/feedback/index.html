  .btn { border:1px solid var(--card-border); background:var(--card-bg); color:var(--text); border-radius:10px; padding:8px 14px; font-size:0.9rem; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.danger { color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%,var(--card-border)); }

  .chip { border:1px solid var(--card-border); background:var(--card-bg); color:var(--muted); border-radius:999px; padding:5px 14px; font-size:0.85rem; font-weight:600; cursor:pointer; }

  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stat { font-size:0.9rem; color:var(--muted); }
  .fb { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; box-shadow:var(--card-shadow); }
  .fb .f-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .fb .f-title { font-weight:700; color:var(--text); }
  .fb .f-meta { font-size:0.8rem; color:var(--muted); }
  .badge { font-size:0.72rem; font-weight:700; border-radius:999px; padding:2px 10px; white-space:nowrap; }
  .badge.c-建议 { background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); }
  .badge.c-Bug { background:color-mix(in srgb,var(--danger) 14%,transparent); color:var(--danger); }
  .badge.c-功能 { background:color-mix(in srgb,#1f9d55 14%,transparent); color:#1f9d55; }
  .badge.c-其他 { background:color-mix(in srgb,#8a8f98 16%,transparent); color:#666; }
  .fb .f-msg { font-size:0.94rem; color:var(--text); margin:10px 0; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .fb .f-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .fb .f-sub { font-size:0.78rem; color:var(--muted); }
  .empty { color:var(--muted); opacity:0.8; font-style:italic; padding:20px 0; }
  .denied { text-align:center; padding:60px 0; color:var(--muted); }
  .toast { position:fixed; left:50%; top:22px; transform:translateX(-50%); z-index:300; background:#1c2733; color:#fff; padding:10px 18px; border-radius:10px; font-size:0.9rem; box-shadow:0 6px 20px rgba(0,0,0,0.3); opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show { opacity:1; }
  .site-footer { border-top:1px solid var(--card-border); margin-top:40px; padding:24px; text-align:center; color:var(--muted); font-size:0.9rem; }

  <script>
    (function () {
      var _main = document.querySelector('main');
      if (_main) _main.style.visibility = 'hidden';
      fetch('/api/me')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
          if (!me || !me.isAdmin) { location.replace('../../index.html'); return; }
          if (_main) _main.style.visibility = '';
          initPage();
        })
        .catch(function () { location.replace('../../index.html'); });

      function initPage() {
        var CATS = ['建议', 'Bug', '功能', '其他'];
        var listEl = document.getElementById('list');
        var emptyEl = document.getElementById('empty');
        var deniedEl = document.getElementById('denied');
        var toolbar = document.getElementById('toolbar');
        var filtersEl = document.getElementById('filters');
        var statEl = document.getElementById('stat');
        var toastEl = document.getElementById('toast');
        var all = [];
        var filter = '全部';

        function toast(m){ toastEl.textContent=m; toastEl.className='toast show'; setTimeout(function(){toastEl.className='toast';},2200); }
        function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
        function fmt(ts){ try{return new Date(ts).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }
        function cat(r){ return CATS.indexOf(r.category) >= 0 ? r.category : '其他'; }

        function renderFilters() {
          var counts = { '全部': all.length };
          CATS.forEach(function(c){ counts[c] = all.filter(function(r){ return cat(r)===c; }).length; });
          var keys = ['全部'].concat(CATS);
          filtersEl.innerHTML = '';
          keys.forEach(function(k){
            if (k !== '全部' && !counts[k]) return; // 没有的分类不显示
            var b = document.createElement('button');
            b.className = 'chip' + (k === filter ? ' active' : '');
            b.textContent = k + ' ' + counts[k];
            b.addEventListener('click', function(){ filter = k; render(); });
            filtersEl.appendChild(b);
          });
        }

        function render() {
          renderFilters();
          var rows = filter === '全部' ? all : all.filter(function(r){ return cat(r) === filter; });
          statEl.textContent = '共 ' + all.length + ' 条 · 当前显示 ' + rows.length + ' 条';
          if (!rows.length) { emptyEl.hidden = false; listEl.innerHTML = ''; return; }
          emptyEl.hidden = true;
          listEl.innerHTML = '';
          rows.forEach(function(r){
            var card = document.createElement('div');
            card.className = 'fb';
            card.innerHTML =
              '<div class="f-head">' +
                '<span class="badge c-' + cat(r) + '">' + esc(cat(r)) + '</span>' +
                '<span class="f-title"></span>' +
                '<span class="f-meta">' + fmt(r.ts) + '</span>' +
              '</div>' +
              '<div class="f-msg"></div>' +
              '<div class="f-actions">' +
                '<a class="btn" data-act="reply" href="#"></a>' +
                '<span class="f-sub"></span>' +
                '<button class="btn danger" data-act="delete" data-id="' + esc(r.id) + '">删除</button>' +
              '</div>';
            card.querySelector('.f-title').textContent = r.name || '（匿名）';
            card.querySelector('.f-msg').textContent = r.msg || '';
            var mail = card.querySelector('[data-act="reply"]');
            mail.textContent = '✉ ' + (r.email || '');
            mail.setAttribute('href', 'mailto:' + (r.email || '') + '?subject=' + encodeURIComponent('Re: 小蓝页反馈'));
            card.querySelector('.f-sub').textContent = (r.page ? '来自 ' + r.page : '') + (r.ip ? ' · IP ' + r.ip : '');
            listEl.appendChild(card);
          });
          listEl.querySelectorAll('button[data-act="delete"]').forEach(function(b){
            b.addEventListener('click', function(){ del(b.getAttribute('data-id')); });
          });
        }

        function load() {
          fetch('/api/contact')
            .then(function(r){ return r.ok ? r.json() : { error:'forbidden', status:r.status }; })
            .then(function(d){
              if (d.error === 'forbidden' || d.error === 'unauthorized') { deniedEl.hidden=false; toolbar.hidden=true; filtersEl.hidden=true; return; }
              toolbar.hidden = false;
              filtersEl.hidden = false;
              all = d.list || [];
              render();
            })
            .catch(function(){ deniedEl.hidden=false; deniedEl.querySelector('p').textContent='加载失败，请重试。'; });
        }

        function del(id) {
          if (!id) return;
          if (!confirm('确定删除这条反馈？此操作不可恢复。')) return;
          fetch('/api/contact?id=' + encodeURIComponent(id), { method:'DELETE' })
            .then(function(r){ return r.ok ? r.json() : { ok:false }; })
            .then(function(d){ if (d.ok) { toast('已删除 ✓'); load(); } else { toast('删除失败'); } })
            .catch(function(){ toast('删除失败（网络错误）'); });
        }

        document.getElementById('refresh').addEventListener('click', load);
        load();
      }
    })();
  </script>

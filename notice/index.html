  .notice .meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }

  .notice .del { float: right; border: none; background: transparent; color: var(--danger); font-size: 0.85rem; cursor: pointer; font-weight: 700; }
  .notice .del:hover { text-decoration: underline; }
  .hint { color: var(--muted); opacity: 0.7; font-style: italic; font-size: 0.95rem; }

  .edit-input, .edit-textarea { width: 100%; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; font-size: 1rem; font-family: inherit; color: var(--text); background: var(--panel-bg); margin-top: 6px; }
  .edit-input:focus, .edit-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .edit-textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
  .edit-label { display: block; font-size: 0.82rem; color: var(--muted); margin-top: 14px; font-weight: 600; }
  .post-btn { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .post-btn:hover { filter: brightness(1.08); }

  .toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 300; background: #1c2733; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 0.9rem; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
  .toast.err { background: var(--danger); }

  .site-footer { border-top: 1px solid var(--card-border); margin-top: 48px; padding: 24px; text-align: center; color: var(--muted); font-size: 0.9rem; line-height: 1.8; }

  .site-footer a:hover { text-decoration: underline; }
  @media (max-width: 560px) { .topbar { padding: 0 14px; min-height: 56px; } .site-name { font-size: 1.05rem; } .content { padding: 28px 16px 48px; } .hero h1 { font-size: 1.6rem; } }
  [hidden] { display: none !important; }

  <script src="../auth.js"></script>
  <script>
    (function () {
      var FORBIDDEN = ['fuck','shit','bitch','asshole','bastard','dick','cunt','whore','slut','nigger','faggot','retard','tranny','nazi','kill yourself','kys','傻逼','sb','草泥马','操你','日你','妈的','贱人','婊子','杂种','滚蛋','废青','支那','洋奴','汉奸','狗杂种','加微信','扫码领','免费送','刷单','博彩','赌博','色情','裸聊','办证','代开发票','点击领取','一元购','日赚','月入过万','私聊客服'];
      function findForbidden(t){ if(!t) return null; var low=String(t).toLowerCase(); for(var i=0;i<FORBIDDEN.length;i++){ if(low.indexOf(FORBIDDEN[i].toLowerCase())!==-1) return FORBIDDEN[i]; } return null; }

      var listEl = document.getElementById('list');
      var emptyEl = document.getElementById('empty');
      var adminPanel = document.getElementById('adminPanel');
      var nTitle = document.getElementById('nTitle');
      var nBody = document.getElementById('nBody');
      var postBtn = document.getElementById('postBtn');
      var toastEl = document.getElementById('toast');

      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }
      function fmtTime(ts) {
        try { return new Date(ts).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
      }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

      function render(notices, isAdmin) {
        listEl.innerHTML = '';
        if (!notices.length) { emptyEl.hidden = false; return; }
        emptyEl.hidden = true;
        notices.forEach(function (n) {
          var card = document.createElement('div'); card.className = 'notice';
          var del = isAdmin ? '<button class="del" data-id="' + n.id + '">删除</button>' : '';
          card.innerHTML = del + '<h3></h3><div class="meta"></div><p></p>';
          card.querySelector('h3').textContent = n.title || '（无标题）';
          card.querySelector('.meta').textContent = fmtTime(n.ts);
          card.querySelector('p').textContent = n.body || '';
          if (isAdmin) {
            card.querySelector('.del').addEventListener('click', function () { delNotice(n.id); });
          }
          listEl.appendChild(card);
        });
      }

      function load() {
        fetch('/api/notice')
          .then(function (r) { return r.ok ? r.json() : { notices: [] }; })
          .then(function (d) {
            var isAdmin = !!(window.JW_AUTH && window.JW_AUTH.isAdmin);
            render(d.notices || [], isAdmin);
            if (isAdmin) adminPanel.hidden = false;
          })
          .catch(function () { render([], false); });
      }

      function post() {
        var title = nTitle.value.trim();
        var body = nBody.value.trim();
        if (!title && !body) { toast('标题和内容不能都为空', true); return; }
        var w = findForbidden(title) || findForbidden(body);
        if (w) { toast('含违禁词：「' + w + '」', true); return; }
        fetch('/api/notice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, body: body }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            if (res.ok) { nTitle.value = ''; nBody.value = ''; toast('已发布 ✓'); load(); }
            else if (res.body && res.body.error === 'forbidden') { toast('服务器拦截：含违禁词「' + (res.body.word || '') + '」', true); }
            else { toast('发布失败', true); }
          })
          .catch(function () { toast('发布失败（网络错误）', true); });
      }

      function delNotice(id) {
        if (!confirm('确定删除这条通知？')) return;
        fetch('/api/notice?id=' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function () { load(); })
          .catch(function () { toast('删除失败', true); });
      }

      postBtn.addEventListener('click', post);

      // 进入页面即标记已读（清空红点）
      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.login) {
          fetch('/api/notice/seen', { method: 'POST' }).catch(function () {}).finally(load);
        } else {
          load();
        }
      }).catch(load);
    })();
  </script>

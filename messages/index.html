  .thread { display: flex; flex-direction: column; min-height: 420px; }

  .composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; font-family: inherit; color: var(--text); background: var(--panel-bg); }
  .composer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .composer button { align-self: flex-end; }
  .hint { color: var(--muted); font-size: 0.92rem; line-height: 1.7; }

  .toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 300; background: #1c2733; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 0.9rem; box-shadow: 0 6px 20px rgba(0,0,0,0.3); opacity: 0; transition: opacity .25s; pointer-events: none; }

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var convList = $('convList'), messages = $('messages'), threadHead = $('threadHead'),
          composer = $('composer'), dmBody = $('dmBody'), sendBtn = $('sendBtn'),
          newPeer = $('newPeer'), newDmBtn = $('newDmBtn'), toastEl = $('toast');
      var ME = null, currentPeer = null;

      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
      function fmtTime(ts){ try { return new Date(ts).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } }

      function loadConversations() {
        fetch('/api/message')
          .then(function (r) { return r.ok ? r.json() : { conversations: [] }; })
          .then(function (d) {
            var convs = (d.conversations || []);
            if (!convs.length) { convList.innerHTML = '<div class="empty">还没有会话</div>'; return; }
            convList.innerHTML = '';
            convs.forEach(function (c) {
              var el = document.createElement('div');
              el.className = 'conv' + (c.peer === currentPeer ? ' active' : '');
              el.dataset.peer = c.peer;
              var peer = document.createElement('span'); peer.className = 'peer'; peer.textContent = '@' + c.peer;
              var last = document.createElement('span'); last.className = 'last'; last.textContent = c.last || '';
              el.appendChild(peer); el.appendChild(last);
              if (c.unread > 0) { var u = document.createElement('span'); u.className = 'unread'; u.textContent = c.unread; el.appendChild(u); }
              el.addEventListener('click', function () { openThread(c.peer); });
              convList.appendChild(el);
            });
          })
          .catch(function () { convList.innerHTML = '<div class="empty">加载失败</div>'; });
      }

      function openThread(peer) {
        currentPeer = peer;
        threadHead.textContent = '与 @' + peer + ' 的私信';
        composer.hidden = false;
        Array.prototype.forEach.call(convList.querySelectorAll('.conv'), function (el) {
          el.classList.toggle('active', el.dataset.peer === peer);
        });
        loadThread(peer);
        dmBody.focus();
      }

      function loadThread(peer) {
        fetch('/api/message?with=' + encodeURIComponent(peer))
          .then(function (r) { return r.ok ? r.json() : { messages: [] }; })
          .then(function (d) {
            var msgs = (d.messages || []);
            messages.innerHTML = '';
            if (!msgs.length) { messages.innerHTML = '<p class="hint">还没有消息，发送第一条吧。</p>'; return; }
            msgs.forEach(function (m) {
              var b = document.createElement('div');
              b.className = 'bubble ' + (m.from === ME ? 'msg-me' : 'msg-peer');
              b.innerHTML = esc(m.body) + '<span class="ts">' + fmtTime(m.ts) + '</span>';
              messages.appendChild(b);
            });
            messages.scrollTop = messages.scrollHeight;
          })
          .catch(function () { messages.innerHTML = '<p class="hint">加载失败</p>'; });
      }

      function send() {
        var to = currentPeer;
        var text = dmBody.value.trim();
        if (!to || !text) return;
        sendBtn.disabled = true;
        fetch('/api/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: to, body: text }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            sendBtn.disabled = false;
            if (res.ok) { dmBody.value = ''; loadThread(to); loadConversations(); }
            else if (res.body && res.body.error === 'no_recipient') toast('对方不是本站用户', true);
            else if (res.body && res.body.error === 'cannot_self') toast('不能给自己发私信', true);
            else if (res.body && res.body.error === 'rate_limited') toast('发送太快，请稍后再试', true);
            else toast('发送失败', true);
          })
          .catch(function () { sendBtn.disabled = false; toast('网络错误', true); });
      }

      function startNew() {
        var peer = newPeer.value.trim();
        if (!peer) { toast('请输入对方登录名', true); return; }
        openThread(peer);
      }

      sendBtn.addEventListener('click', send);
      newDmBtn.addEventListener('click', startNew);
      dmBody.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });

      fetch('/api/me')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
          if (me && me.login) { ME = me.login; loadConversations(); }
          else { threadHead.textContent = '请先登录后使用私信'; composer.hidden = true; convList.innerHTML = '<div class="empty">请先登录</div>'; }
        })
        .catch(function () { threadHead.textContent = '加载失败'; });
    })();
  </script>

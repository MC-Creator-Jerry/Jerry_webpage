<style>
  :root {
    --bar-top: rgb(40, 89, 156);
    --bar-bottom: rgb(0, 120, 212);
    --accent: #0078d4;
    --font-scale: 1;
    --radius: 14px;
    --bg: #f4f6f9;
    --text: #1c2733;
    --muted: #44556a;
    --card-bg: #ffffff;
    --card-border: #e3e8ef;
    --card-shadow: 0 1px 4px rgba(20, 35, 59, 0.05);
    --bar-fg: #ffffff;

  }
  html[data-theme="dark"] {
    --bg: #0f1720; --text: #e6edf5; --muted: #9fb0c3;
    --card-bg: #16212e; --card-border: #243244; --card-shadow: 0 1px 6px rgba(0,0,0,.4);
    --panel-bg: #16212e; --panel-border: #243244;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: calc(16px * var(--font-scale)); }
  html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); transition: background .25s, color .25s; }
  .topbar { position: sticky; top: 0; z-index: 100; min-height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background-color: var(--bar-top); background-image: linear-gradient(180deg, var(--bar-top) 0%, var(--bar-top) 45%, var(--bar-bottom) 100%); color: var(--bar-fg); box-shadow: 0 2px 10px rgba(0,0,0,.18); border-radius: 0; }
  .bar-left { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
  .site-name { font-size: 1.25rem; font-weight: 700; color: var(--bar-fg); text-decoration: none; cursor: pointer; }
  .breadcrumb { display: flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--bar-fg); opacity: .9; }
  .breadcrumb a { color: var(--bar-fg); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; opacity: 1; }
  .bar-right { display: flex; align-items: center; gap: 8px; }
  .bar-btn { border: none; background: rgba(255,255,255,.08); color: var(--bar-fg); border-radius: 0; padding: 6px 11px; font-size: .9rem; font-weight: 600; cursor: pointer; line-height: 1; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .bar-btn:hover { background: rgba(255,255,255,.18); }

  
  
  

  .content { max-width: 820px; margin: 0 auto; padding: 40px 24px 64px; }
  .hero { margin-bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hero h1 { font-size: 1.9rem; line-height: 1.25; color: var(--text); margin-bottom: 8px; }
  .hero p { font-size: 1.02rem; line-height: 1.7; color: var(--muted); max-width: 600px; }
  .post-link { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 9px 16px; font-size: .92rem; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .post-link:hover { filter: brightness(1.08); }
  .card { margin-top: 18px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--card-shadow); }
  .edit-label { display: block; font-size: .82rem; color: var(--muted); margin-top: 14px; font-weight: 600; }
  .edit-input, .edit-textarea { width: 100%; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; font-size: 1rem; font-family: inherit; color: var(--text); background: var(--panel-bg); margin-top: 6px; }
  .edit-input:focus, .edit-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .edit-textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
  .post-btn { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 18px; font-size: .95rem; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .post-btn:hover { filter: brightness(1.08); }
  .post-btn.secondary { background: rgba(128,128,128,.18); color: var(--text); }
  .hint { color: var(--muted); opacity: .7; font-style: italic; font-size: .95rem; }
  .group-card { border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; background: var(--card-bg); transition: border-color .15s, transform .1s; }
  .group-card:hover { border-color: var(--accent); }
  .gc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .gc-name { font-size: 1.1rem; font-weight: 700; color: var(--text); text-decoration: none; }
  .gc-name:hover { color: var(--accent); }
  .gc-count { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .gc-desc { font-size: .92rem; color: var(--muted); margin-top: 6px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .gc-owner { font-size: .8rem; color: var(--muted); margin-top: 10px; }
  .gc-owner a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .gc-owner a:hover { text-decoration: underline; }
  .toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 300; background: #1c2733; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.3); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
  .toast.err { background: var(--danger); }
  .site-footer { border-top: 1px solid var(--card-border); margin-top: 48px; padding: 24px; text-align: center; color: var(--muted); font-size: .9rem; }
  .site-footer a { color: var(--accent); text-decoration: none; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { .topbar { padding: 0 14px; min-height: 56px; } .site-name { font-size: 1.05rem; } .content { padding: 28px 16px 48px; } .hero h1 { font-size: 1.6rem; } }
</style>

<body>
  <header class="topbar">
    <div class="bar-left">
      <a class="site-name" href="../index.html">Jerry's webpage</a>
      <nav class="breadcrumb"><a href="../index.html">主页</a><span>›</span><span>群组</span></nav>
    </div>
    <div class="bar-right">
      <a class="bar-btn" id="noticeBtn" href="../notice/">消息中心</a>
      <a class="bar-btn" id="newPostBtn" href="../post/new/">新加帖子</a>
      <a class="bar-btn" href="../helpcenter/">帮助中心</a>
      <a class="bar-btn" id="loginBtn" href="#">登录</a>
      <a class="bar-btn" id="logoutBtn" href="#" style="display:none">退出</a>
    </div>
  </header>

  <main class="content">
    <section class="hero">
      <div>
        <h1>群组</h1>
        <p>创建或加入感兴趣的社群，和同好一起讨论。</p>
      </div>
      <button class="post-link" id="newGroupBtn" hidden>创建群组</button>
    </section>

    <section class="card" id="createCard" hidden>
      <label class="edit-label" for="gName">群组名称</label>
      <input class="edit-input" id="gName" maxlength="60" placeholder="例如：摄影爱好者" />
      <label class="edit-label" for="gDesc">简介</label>
      <textarea class="edit-textarea auto-grow" id="gDesc" maxlength="280" placeholder="这个群组是做什么的？"></textarea>
      <button class="post-btn" id="createBtn">创建</button>
    </section>

    <section class="card">
      <div id="list"></div>
      <div id="empty" class="hint" hidden>还没有群组，点右上角「创建群组」开一个吧。</div>
    </section>
  </main>

  <footer class="site-footer"><div>© 2026 Jerry's webpage · 小蓝页 · <a href="../index.html">返回主页</a> · <a href="../contact.html" data-zh="联系与建议" data-en="Contact">联系与建议</a></div></footer>
  <div class="toast" id="toast"></div>

  <div class="float-actions">

    </a>
    <a class="fab" href="../settings/homepage.html" target="_blank" rel="noopener" aria-label="设置" title="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </div>

  <script src="../auth.js?v=20260829d"></script>
  <script>
    (function () {
      var toastEl = document.getElementById('toast');
      var listEl = document.getElementById('list');
      var emptyEl = document.getElementById('empty');
      var newGroupBtn = document.getElementById('newGroupBtn');
      var createCard = document.getElementById('createCard');
      var gName = document.getElementById('gName');
      var gDesc = document.getElementById('gDesc');
      var createBtn = document.getElementById('createBtn');
      var meLogin = null;

      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

      function load() {
        fetch('/api/group').then(function (r) { return r.ok ? r.json() : { groups: [] }; })
          .then(function (d) {
            var groups = d.groups || [];
            listEl.innerHTML = '';
            if (!groups.length) { emptyEl.hidden = false; return; }
            emptyEl.hidden = true;
            groups.forEach(function (g) {
              var card = document.createElement('div'); card.className = 'group-card';
              card.innerHTML =
                '<div class="gc-head"><a class="gc-name" href="detail/?group=' + encodeURIComponent(g.id) + '"></a><span class="gc-count">' + (g.memberCount || 0) + ' 成员</span></div>' +
                (g.desc ? '<div class="gc-desc"></div>' : '') +
                '<div class="gc-owner">创建者 <a href="../personal_profile/?user=' + encodeURIComponent(g.owner) + '">@' + esc(g.owner) + '</a></div>';
              card.querySelector('.gc-name').textContent = g.name;
              if (g.desc) card.querySelector('.gc-desc').textContent = g.desc;
              listEl.appendChild(card);
            });
          })
          .catch(function () { emptyEl.hidden = false; emptyEl.textContent = '加载失败。'; });
      }

      newGroupBtn.addEventListener('click', function () { createCard.hidden = !createCard.hidden; });
      createBtn.addEventListener('click', function () {
        var name = gName.value.trim();
        var desc = gDesc.value.trim();
        if (!name) { toast('请填写群组名称', true); return; }
        createBtn.disabled = true;
        fetch('/api/group', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'create', name: name, desc: desc })
        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            createBtn.disabled = false;
            if (res.ok && res.body.id) { toast('已创建 ✓'); location.href = 'detail/?group=' + encodeURIComponent(res.body.id); }
            else if (res.body && res.body.error === 'unauthorized') { toast('请先登录', true); }
            else if (res.body && res.body.error === 'forbidden') { toast('含违禁词', true); }
            else { toast('创建失败', true); }
          })
          .catch(function () { createBtn.disabled = false; toast('网络错误', true); });
      });

      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.login) { meLogin = me.login; newGroupBtn.hidden = false; }
      }).catch(function () {});
      load();
    })();
  </script>
  <script src="../common.js?v=20260829d"></script>
</body>

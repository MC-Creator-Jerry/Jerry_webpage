  <script src="../../auth.js"></script>
  <script>
    (function () {
      var FORBIDDEN = ['fuck','shit','bitch','asshole','bastard','dick','cunt','whore','slut','nigger','faggot','retard','tranny','nazi','kill yourself','kys','傻逼','sb','草泥马','操你','日你','妈的','贱人','婊子','杂种','滚蛋','废青','支那','洋奴','汉奸','狗杂种','加微信','扫码领','免费送','刷单','博彩','赌博','色情','裸聊','办证','代开发票','点击领取','一元购','日赚','月入过万','私聊客服'];
      function findForbidden(t){ if(!t) return null; var low=String(t).toLowerCase(); for(var i=0;i<FORBIDDEN.length;i++){ if(low.indexOf(FORBIDDEN[i].toLowerCase())!==-1) return FORBIDDEN[i]; } return null; }

      var formCard = document.getElementById('formCard');
      var loginHint = document.getElementById('loginHint');
      var loginLink = document.getElementById('loginLink');
      var pTitle = document.getElementById('pTitle');
      var pBody = document.getElementById('pBody');
      var postBtn = document.getElementById('postBtn');
      var toastEl = document.getElementById('toast');

      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }

      function post() {
        var title = pTitle.value.trim();
        var body = pBody.value.trim();
        if (!title && !body) { toast('标题和正文不能都为空', true); return; }
        var w = findForbidden(title) || findForbidden(body);
        if (w) { toast('含违禁词：「' + w + '」', true); return; }
        fetch('/api/post', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, body: body }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            if (res.ok) { toast('已发布 ✓'); setTimeout(function () { location.href = '../center/'; }, 700); }
            else if (res.body && res.body.error === 'unauthorized') { toast('请先登录', true); }
            else if (res.body && res.body.error === 'forbidden') { toast('服务器拦截：含违禁词「' + (res.body.word || '') + '」', true); }
            else { toast('发布失败', true); }
          })
          .catch(function () { toast('发布失败（网络错误）', true); });
      }

      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.login) { formCard.hidden = false; }
        else { loginHint.hidden = false; }
      }).catch(function () { loginHint.hidden = false; });

      loginLink.addEventListener('click', function (e) { e.preventDefault(); if (window.JW_AUTH && window.JW_AUTH.loginWithGitHub) window.JW_AUTH.loginWithGitHub(); else location.href = '../../index.html'; });
      postBtn.addEventListener('click', post);
    })();
  </script>

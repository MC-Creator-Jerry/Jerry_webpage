<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的勋章 · 小蓝页</title>
<meta property="og:title" content="我的勋章 · 小蓝页" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../common.css?v=20261103a" />

  <style>
    :root{--bg:#f6f8fc;--card:#fff;--bd:#e3e8f0;--tx:#222;--mu:#6b7280;--ac:#2f6fed}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
    header{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
    header a{color:var(--ac);text-decoration:none}header h1{font-size:1.5rem;margin:0;flex:1}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
    input[type=text],select{padding:10px 12px;border:1px solid var(--bd);border-radius:9px;font:inherit;background:var(--card);color:var(--tx)}
    button{padding:9px 16px;border:1px solid var(--bd);border-radius:9px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
    button.ghost{background:transparent;color:var(--ac)}
    ul{list-style:none;padding:0;margin:0}li{padding:12px 0;border-bottom:1px solid var(--bd)}
    li:last-child{border:0}.tag{display:inline-block;font-size:12px;background:rgba(47,111,237,.1);color:var(--ac);border-radius:6px;padding:1px 7px;margin-right:8px}
    .muted{color:var(--mu);font-size:.9rem}a.res{color:var(--tx);text-decoration:none;font-weight:600}
    a.res:hover{color:var(--ac)}footer{text-align:center;color:var(--mu);font-size:.9rem;margin-top:30px}
    @media(prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1d2027;--bd:#32363f;--tx:#eee;--mu:#9aa1ad}}
  </style>
</head><body><div class="wrap">

<header><a href="../">← 返回小蓝页</a><h1>我的勋章</h1></header>
<div class="card">
  <h2 style="margin:0 0 8px;font-size:1.1rem">等级与积分</h2>
  <p class="muted" id="stat" style="margin:0">加载中…</p>
</div>
<div class="card"><ul id="badges"><li class="muted">加载中…</li></ul></div>

<footer><span class="uikit-foot"><a href="../sitemap.xml">站点地图</a> · <a href="/feed.xml">RSS 订阅</a></span><br>© 2026 Jerry · <a href="../">小蓝页</a></footer>
</div>

<script>
(function(){
  fetch('/api/achievements',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){
    var st=document.getElementById('stat'),l=document.getElementById('badges');
    if(!d.loggedIn){st.textContent='登录后查看你的勋章与等级。';l.innerHTML='<li class="muted"><a href="../settings/homepage.html">去登录 →</a></li>';return}
    st.textContent='Lv.'+d.level+' · '+d.points+' 积分 · 已获得 '+d.earned+'/'+d.total+' 枚勋章 · 累计登录 '+d.stats.days+' 天 · 关注 '+d.stats.following+' 人 · 粉丝 '+d.stats.followers+' 人';
    l.innerHTML='';
    d.badges.forEach(function(b){
      var li=document.createElement('li');
      li.style.opacity=b.earned?'1':'.55';
      li.innerHTML='<b>'+(b.earned?'✓ ':'○ ')+b.name+'</b> <span class="tag">'+b.progress+'/'+b.goal+'</span>'+
        '<div class="muted">'+b.desc+'</div>';
      l.appendChild(li);
    });
  }).catch(function(){document.getElementById('stat').textContent='加载失败。'});
})();
</script>

<script src="../assets/ui-kit.js?v=20261109a" data-uikit="lazy,keys,skeleton,sw"></script>
</body></html>

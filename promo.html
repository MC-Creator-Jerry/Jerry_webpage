    --accent: #0078d4;

  h1 { font-size: 1.6rem; font-weight: 800; }
  .player {
    width: min(960px, 100%);
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(10, 25, 50, 0.18);
  }
  .player video { width: 100%; height: 100%; display: block; }
  .back { color: var(--accent); text-decoration: none; font-weight: 600; }

    padding: 18px;

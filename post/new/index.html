  <script>
    (function () {
      var FORBIDDEN = ['fuck','shit','bitch','asshole','bastard','dick','cunt','whore','slut','nigger','faggot','retard','tranny','nazi','kill yourself','kys','傻逼','sb','草泥马','操你','日你','妈的','贱人','婊子','杂种','滚蛋','废青','支那','洋奴','汉奸','狗杂种','加微信','扫码领','免费送','刷单','博彩','赌博','色情','裸聊','办证','代开发票','点击领取','一元购','日赚','月入过万','私聊客服'];
      function findForbidden(t){ if(!t) return null; var low=String(t).toLowerCase(); for(var i=0;i<FORBIDDEN.length;i++){ if(low.indexOf(FORBIDDEN[i].toLowerCase())!==-1) return FORBIDDEN[i]; } return null; }

      var formCard = document.getElementById('formCard');
      var loginHint = document.getElementById('loginHint');
      var loginLink = document.getElementById('loginLink');
      var pTitle = document.getElementById('pTitle');
      var pBody = document.getElementById('pBody');
      var postBtn = document.getElementById('postBtn');
      var toastEl = document.getElementById('toast');
      var charCount = document.querySelector('.char-count[data-for="pBody"]');
      var BODY_MAX = 5000;

      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }

      function bodyText() { return (pBody.innerText || '').replace(/\n+$/, ''); }
      function updateCount() {
        if (charCount) charCount.textContent = bodyText().length + ' / ' + BODY_MAX;
      }
      pBody.addEventListener('input', updateCount);

      // ===== 富文本工具栏 =====
      var toolbar = document.getElementById('rtToolbar');
      function exec(cmd, val) {
        pBody.focus();
        try { document.execCommand(cmd, false, val || null); } catch (e) {}
        refreshToolbarState();
      }
      function refreshToolbarState() {
        var map = { bold: 'bold', italic: 'italic', underline: 'underline', strikeThrough: 'strikeThrough',
          insertUnorderedList: 'insertUnorderedList', insertOrderedList: 'insertOrderedList', justifyLeft: 'justifyLeft', justifyCenter: 'justifyCenter', justifyRight: 'justifyRight', justifyFull: 'justifyFull' };
        Object.keys(map).forEach(function (cmd) {
          var btn = toolbar.querySelector('[data-cmd="' + cmd + '"]');
          if (!btn) return;
          var on = false;
          try { on = document.queryCommandState(cmd); } catch (e) {}
          btn.classList.toggle('on', !!on);
        });
      }
      // 点击工具栏不丢失编辑器选区
      toolbar.addEventListener('mousedown', function (e) { if (e.target.closest('select, input')) return; e.preventDefault(); });
      toolbar.addEventListener('click', function (e) {
        var btn = e.target.closest('.rt-btn');
        if (!btn) return;
        if (btn.id === 'rtLink') {
          var url = window.prompt('链接地址（以 http:// 或 https:// 开头）：', 'https://');
          if (url && /^https?:\/\//i.test(url)) exec('createLink', url);
          return;
        }
        var cmd = btn.getAttribute('data-cmd');
        var val = btn.getAttribute('data-val');
        exec(cmd, val);
      });
      document.getElementById('rtFont').addEventListener('change', function () { if (this.value) { exec('fontName', this.value); this.selectedIndex = 0; } });
      document.getElementById('rtSize').addEventListener('change', function () { if (this.value) { exec('fontSize', this.value); this.selectedIndex = 0; } });
      document.getElementById('rtColor').addEventListener('input', function () { exec('foreColor', this.value); });
      document.getElementById('rtBg').addEventListener('input', function () { try { exec('hiliteColor', this.value); } catch (e) { exec('backColor', this.value); } });
      pBody.addEventListener('keyup', refreshToolbarState);
      pBody.addEventListener('mouseup', refreshToolbarState);

      // ===== 附件上传 =====
      var MAX_FILE = 20 * 1024 * 1024;
      var pFiles = document.getElementById('pFiles');
      var attAddBtn = document.getElementById('attAddBtn');
      var attList = document.getElementById('attList');
      var selectedFiles = [];
      function fmtSize(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
      function extOf(name) { var p = String(name).split('.').pop(); return (p ? p : 'FILE').toUpperCase().slice(0, 5); }
      function renderAtt() {
        attList.innerHTML = '';
        selectedFiles.forEach(function (f, i) {
          var item = document.createElement('div'); item.className = 'att-item';
          var thumb = document.createElement('div'); thumb.className = 'att-thumb';
          if (/^image\//.test(f.type || '')) {
            var img = document.createElement('img');
            img.src = URL.createObjectURL(f); img.alt = '';
            img.onload = function () { URL.revokeObjectURL(img.src); };
            thumb.appendChild(img);
          } else {
            thumb.textContent = extOf(f.name);
          }
          var info = document.createElement('div'); info.className = 'att-info';
          var nm = document.createElement('div'); nm.className = 'att-name'; nm.textContent = f.name;
          var sub = document.createElement('div'); sub.className = 'att-sub'; sub.textContent = fmtSize(f.size);
          info.appendChild(nm); info.appendChild(sub);
          var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'att-remove'; rm.textContent = '×'; rm.title = '移除';
          rm.addEventListener('click', function () { selectedFiles.splice(i, 1); renderAtt(); });
          item.appendChild(thumb); item.appendChild(info); item.appendChild(rm);
          attList.appendChild(item);
        });
      }
      attAddBtn.addEventListener('click', function () { pFiles.click(); });
      pFiles.addEventListener('change', function () {
        Array.prototype.forEach.call(pFiles.files, function (f) {
          if (f.size > MAX_FILE) { toast('文件「' + f.name + '」超过 20MB 上限', true); return; }
          if (selectedFiles.length >= 20) { toast('最多 20 个附件', true); return; }
          selectedFiles.push(f);
        });
        pFiles.value = '';
        renderAtt();
      });

      function uploadOne(file) {
        return new Promise(function (resolve, reject) {
          var fd = new FormData();
          fd.append('file', file, file.name);
          fetch('/api/upload', { method: 'POST', body: fd })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
            .then(function (res) {
              if (res.ok && res.body.ok) resolve({ key: res.body.key, name: res.body.name, type: res.body.type, size: res.body.size });
              else reject(new Error(res.body && res.body.error ? res.body.error : 'upload_failed'));
            })
            .catch(function () { reject(new Error('network')); });
        });
      }

      function post() {
        var title = pTitle.value.trim();
        var html = pBody.innerHTML.trim();
        var text = bodyText().trim();
        if (!title && !text) { toast('标题和正文不能都为空', true); return; }
        if (text.length > BODY_MAX) { toast('正文过长（上限 ' + BODY_MAX + ' 字）', true); return; }
        var w = findForbidden(title) || findForbidden(text);
        if (w) { toast('含违禁词：「' + w + '」', true); return; }
        if (!selectedFiles.length) { doPublish(title, html, []); return; }
        postBtn.disabled = true; postBtn.textContent = '上传中 0/' + selectedFiles.length;
        var done = 0;
        Promise.all(selectedFiles.map(function (f) {
          return uploadOne(f).then(function (meta) { done++; postBtn.textContent = '上传中 ' + done + '/' + selectedFiles.length; return meta; });
        })).then(function (files) {
          doPublish(title, html, files);
        }).catch(function (err) {
          postBtn.disabled = false; postBtn.textContent = '发布';
          toast(err && err.message === 'too_large' ? '文件过大（上限 20MB）' : '附件上传失败，请重试', true);
        });
      }
      function doPublish(title, html, files) {
        fetch('/api/post', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, body: html, files: files }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            postBtn.disabled = false; postBtn.textContent = '发布';
            if (res.ok) { toast('已发布 ✓'); selectedFiles = []; setTimeout(function () { location.href = '../center/'; }, 700); }
            else if (res.body && res.body.error === 'unauthorized') { toast('请先登录', true); }
            else if (res.body && res.body.error === 'forbidden') { toast('服务器拦截：含违禁词「' + (res.body.word || '') + '」', true); }
            else { toast('发布失败', true); }
          })
          .catch(function () { postBtn.disabled = false; postBtn.textContent = '发布'; toast('发布失败（网络错误）', true); });
      }

      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.login) { formCard.hidden = false; updateCount(); }
        else { loginHint.hidden = false; }
      }).catch(function () { loginHint.hidden = false; });

      loginLink.addEventListener('click', function (e) { e.preventDefault(); if (window.JW_AUTH && window.JW_AUTH.loginWithGitHub) window.JW_AUTH.loginWithGitHub(); else location.href = '../../index.html'; });
      postBtn.addEventListener('click', post);
    })();
  </script>
  <script src="../../common.js"></script>
</body>
</html>

  .g-title { font-size: 1.6rem; line-height: 1.35; color: var(--text); word-break: break-word; }

  .g-meta { font-size: .85rem; color: var(--muted); margin-top: 12px; }
  .g-meta a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .g-meta a:hover { text-decoration: underline; }
  .g-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .post-btn { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 9px 18px; font-size: .95rem; font-weight: 700; cursor: pointer; }
  .post-btn:hover { filter: brightness(1.08); }
  .post-btn.secondary { background: rgba(128,128,128,.18); color: var(--text); }
  .post-btn.danger { background: var(--danger); }
  .members-title { font-size: 1.1rem; color: var(--accent); margin: 26px 0 12px; }
  .member { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
  .member:last-child { border-bottom: none; }
  .member .m-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--card-border); }
  .member .m-name { font-weight: 700; color: var(--text); text-decoration: none; }
  .member .m-name:hover { color: var(--accent); }
  .member .m-owner { font-size: .72rem; font-weight: 700; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--card-border)); border-radius: 999px; padding: 1px 9px; }
  .member .m-spacer { flex: 1; }
  .member .m-remove { border: none; background: transparent; color: var(--muted); font-size: .82rem; cursor: pointer; font-weight: 600; }
  .member .m-remove:hover { color: var(--danger); }
  .login-hint { color: var(--muted); opacity: .85; line-height: 1.7; }
  .login-hint a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 300; background: #1c2733; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.3); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
  .toast.err { background: var(--danger); }
  .site-footer { border-top: 1px solid var(--card-border); margin-top: 48px; padding: 24px; text-align: center; color: var(--muted); font-size: .9rem; }
  .site-footer a { color: var(--accent); text-decoration: none; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { .topbar { padding: 0 14px; min-height: 56px; } .site-name { font-size: 1.05rem; } .content { padding: 28px 16px 48px; } .g-title { font-size: 1.4rem; } }

  <script src="../../auth.js?v=20260829d"></script>
  <script>
    (function () {
      var groupId = new URLSearchParams(location.search).get('group');
      var gBox = document.getElementById('gBox');
      var loginHint = document.getElementById('loginHint');
      var toastEl = document.getElementById('toast');
      var meLogin = null, isOwner = false, isMember = false, members = [];

      function toast(msg, isErr) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show' + (isErr ? ' err' : '');
        setTimeout(function () { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
      }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
      function fmtTime(ts){ try { return new Date(ts).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); } catch(e){ return ''; } }

      function render(d) {
        var g = d.group;
        isOwner = d.isOwner; isMember = d.isMember; members = d.members || [];
        gBox.innerHTML =
          '<div class="g-title"></div>' +
          (g.desc ? '<div class="g-desc"></div>' : '') +
          '<div class="g-meta">创建者 <a href="../../personal_profile/?user=' + encodeURIComponent(g.owner) + '">@' + esc(g.owner) + '</a> · ' + (g.memberCount || 0) + ' 名成员 · 创建于 ' + fmtTime(g.ts) + '</div>' +
          '<div class="g-actions" id="gActions"></div>' +
          '<div class="members-title">成员</div><div id="memberList"></div>';
        gBox.querySelector('.g-title').textContent = g.name;
        if (g.desc) gBox.querySelector('.g-desc').textContent = g.desc;
        var actions = gBox.querySelector('#gActions');
        if (meLogin) {
          if (isMember) {
            var leaveBtn = document.createElement('button'); leaveBtn.className = 'post-btn secondary'; leaveBtn.textContent = '退出群组';
            leaveBtn.addEventListener('click', function () { act('leave'); });
            actions.appendChild(leaveBtn);
          } else {
            var joinBtn = document.createElement('button'); joinBtn.className = 'post-btn'; joinBtn.textContent = '加入群组';
            joinBtn.addEventListener('click', function () { act('join'); });
            actions.appendChild(joinBtn);
          }
          if (isOwner) {
            var delBtn = document.createElement('button'); delBtn.className = 'post-btn danger'; delBtn.textContent = '删除群组';
            delBtn.addEventListener('click', function () { if (confirm('确定删除该群组？此操作不可撤销。')) act('delete'); });
            actions.appendChild(delBtn);
          }
        }
        var mlist = gBox.querySelector('#memberList');
        members.forEach(function (login) {
          var row = document.createElement('div'); row.className = 'member';
          var img = document.createElement('img'); img.className = 'm-avatar'; img.src = 'https://github.com/' + encodeURIComponent(login) + '.png'; img.alt = ''; img.onerror = function () { this.style.visibility = 'hidden'; };
          var name = document.createElement('a'); name.className = 'm-name'; name.href = '../../personal_profile/?user=' + encodeURIComponent(login); name.textContent = '@' + login;
          row.appendChild(img); row.appendChild(name);
          if (login === g.owner) { var ob = document.createElement('span'); ob.className = 'm-owner'; ob.textContent = '创建者'; row.appendChild(ob); }
          row.appendChild(document.createElement('span')).className = 'm-spacer';
          if (isOwner && login !== meLogin && login !== g.owner) {
            var rm = document.createElement('button'); rm.className = 'm-remove'; rm.textContent = '移除';
            rm.addEventListener('click', function () { if (confirm('将 @' + login + ' 移出群组？')) act('remove', login); });
            row.appendChild(rm);
          }
          mlist.appendChild(row);
        });
        gBox.hidden = false;
      }

      function act(action, user) {
        if (!meLogin) { if (window.JW_LOGIN) window.JW_LOGIN(); return; }
        var payload = { action: action, id: groupId };
        if (user) payload.user = user;
        fetch('/api/group', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            if (res.ok) {
              if (action === 'delete') { toast('已删除 ✓'); setTimeout(function () { location.href = '../'; }, 600); return; }
              toast(action === 'join' ? '已加入 ✓' : action === 'leave' ? '已退出 ✓' : '已更新 ✓');
              load();
            } else if (res.body && res.body.error === 'unauthorized') { toast('请先登录', true); }
            else if (res.body && res.body.error === 'forbidden') { toast('无权操作', true); }
            else { toast('操作失败', true); }
          })
          .catch(function () { toast('网络错误', true); });
      }

      function load() {
        if (!groupId) { gBox.innerHTML = '<p class="login-hint">缺少群组参数。</p>'; gBox.hidden = false; return; }
        fetch('/api/group?id=' + encodeURIComponent(groupId))
          .then(function (r) { return r.ok ? r.json() : { error: 'not_found' }; })
          .then(function (d) {
            if (d.error) { gBox.innerHTML = '<p class="login-hint">群组不存在或已删除。</p>'; gBox.hidden = false; return; }
            render(d);
          })
          .catch(function () { gBox.innerHTML = '<p class="login-hint">加载失败。</p>'; gBox.hidden = false; });
      }

      document.getElementById('loginLink').addEventListener('click', function (e) { e.preventDefault(); if (window.JW_LOGIN) window.JW_LOGIN(); else location.href = '../../index.html'; });

      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.login) meLogin = me.login;
        else loginHint.hidden = false;
        load();
      }).catch(function () { loginHint.hidden = false; load(); });
    })();
  </script>

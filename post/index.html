<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>帖子中心 · Jerry's webpage</title>
<meta name="description" content="站内帖子中心：查看与发布帖子。" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<!-- 帖子中心入口：真实列表在 /post/center/。
     此页仅作极简跳转——不再渲染整页结构，也不加载 boot.js，
     避免先闪一帧无用界面/加载动画再跳转。 -->
<meta http-equiv="refresh" content="0; url=center/" />
<script>
  (function () {
    // 保留 github.io → pages.dev 的规范跳转（与其它页面一致）
    var gh = location.hostname.indexOf('github.io') !== -1;
    var p = location.pathname.replace(/^\/Jerry_webpage/, '');
    p = p.replace(/index\.html$/, '');
    if (!/\/$/.test(p)) p = p.replace(/[^/]*$/, '');
    location.replace(gh ? 'https://mc-creator-jerry-webpage.pages.dev' + p + 'center/' : 'center/');
  })();
</script>
<style>
  html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#44556a;background:#f4f6f9}
  a{color:#0078d4;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <p>正在前往<a href="center/">帖子中心</a>…</p>
</body>
</html>

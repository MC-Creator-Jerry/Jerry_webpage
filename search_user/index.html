  <script>
    (function () {
      function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
      document.documentElement.setAttribute('data-theme', get('xl_theme', 'light'));
      document.documentElement.style.setProperty('--font-scale', get('xl_font', '1'));
      document.documentElement.style.setProperty('--radius', get('xl_radius', '14') + 'px');
      function applyLang() {
        var en = get('xl_lang', 'zh') === 'en';
        document.documentElement.lang = en ? 'en' : 'zh-CN';
        document.querySelectorAll('[data-zh]').forEach(function (n) { var t = en ? (n.getAttribute('data-en') || n.textContent) : n.getAttribute('data-zh'); if (t != null) n.textContent = t; });
        document.querySelectorAll('[data-zh-ph]').forEach(function (p) { p.placeholder = en ? (p.getAttribute('data-en-ph') || '') : (p.getAttribute('data-zh-ph') || ''); });
      }
      applyLang();
    })();
  </script>
  <script src="../auth.js?v=20260829d"></script>
  <script>
    (function () {
      var q = document.getElementById('q');
      var results = document.getElementById('results');
      var empty = document.getElementById('empty');
      var selfLink = document.getElementById('selfLink');
      var loginPrompt = document.getElementById('loginPrompt');
      var timer = null;

      function render(users) {
        results.innerHTML = '';
        if (!users.length) { empty.hidden = false; return; }
        empty.hidden = true;
        users.forEach(function (u) {
          var a = document.createElement('a');
          a.className = 'user-card';
          a.href = '../personal_profile/?user=' + encodeURIComponent(u.login);
          var img = document.createElement('img'); img.src = u.avatar; img.alt = u.login;
          var box = document.createElement('div');
          box.innerHTML = '<div class="u-name"></div><div class="u-login"></div>' + (u.bio ? '<div class="u-bio"></div>' : '');
          box.querySelector('.u-name').textContent = u.name || u.login;
          box.querySelector('.u-login').textContent = '@' + u.login;
          if (u.bio) box.querySelector('.u-bio').textContent = u.bio;
          a.appendChild(img); a.appendChild(box);
          results.appendChild(a);
        });
      }

      function search() {
        var term = q.value.trim();
        if (!term) { results.innerHTML = ''; empty.hidden = true; return; }
        fetch('/api/users?q=' + encodeURIComponent(term))
          .then(function (r) { return r.ok ? r.json() : { users: [] }; })
          .then(function (d) { render(d.users || []); })
          .catch(function () { render([]); });
      }

      q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(search, 300); });

      fetch('/api/me')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
          if (me && me.login) {
            selfLink.hidden = false;
            search(); // 初始展示全部用户
          } else {
            loginPrompt.hidden = false;
            q.disabled = true;
          }
        })
        .catch(function () { loginPrompt.hidden = false; q.disabled = true; });
    })();
  </script>

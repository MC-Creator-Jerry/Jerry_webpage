    .tl-item:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.10); border-color: var(--accent, #0a6fb5); }

    .tl-kind { border: 1px solid var(--card-border, rgba(127,127,127,.3)); border-radius: 999px; padding: 0 8px; }

<body>
  <header class="topbar">
    <div class="bar-left">
      <a class="site-name" href="/">Jerry's webpage</a>
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/">主页</a><span>›</span><span>全站动态</span>
      </nav>
    </div>
    <div class="bar-right">
      <a class="bar-btn" href="/stats/">流量看板</a>
      <a class="bar-btn" href="/">返回主页</a>
    </div>
  </header>

  <main class="content">
    <section class="hero">
      <div>
        <h1 id="hTitle">全站动态</h1>
        <p id="hDesc">茶馆 · 书栈 · 片屿 · 音乐电台 · 每日要闻 —— 五个站点的最新内容汇成一条时间线。</p>
      </div>
      <div class="hero-actions">
        <button class="refresh-btn" id="refreshBtn" type="button">刷新</button>
      </div>
    </section>

    <div class="chips" id="chips"></div>
    <div class="status" id="status">正在汇总各站动态…</div>
    <div class="timeline" id="timeline"></div>
  </main>

  <footer class="site-footer">
    © 2026 Jerry's webpage · <a href="/">返回主页</a> · 数据每 5 分钟自动刷新一次
  <span class="uikit-foot"><a href="../sitemap.xml">站点地图</a> · <a href="https://mc-creator-jerry-webpage.pages.dev/feed.xml">RSS 订阅</a></span>
</footer>

<script>
(function () {
  'use strict';
  var LANG = 'zh';
  try { LANG = localStorage.getItem('xl_lang') || 'zh'; } catch (e) {}
  var en = LANG === 'en';
  var T = en
    ? { title: 'Site Activity', desc: 'Teahouse · BookStation · Pianyu · Music · Daily News — the latest from all five sites in one timeline.',
        refresh: 'Refresh', all: 'All', loading: 'Collecting updates from all sites…', empty: 'No updates yet.',
        status: 'Updated %t · %s sites · %n items', cached: ' (cached)', partial: 'Some sites are temporarily unavailable: ',
        failed: 'Could not load activity. Please try again later.', justnow: 'just now', hours: 'h ago', days: 'd ago', undated: 'undated' }
    : { title: '全站动态', desc: '茶馆 · 书栈 · 片屿 · 音乐电台 · 每日要闻 —— 五个站点的最新内容汇成一条时间线。',
        refresh: '刷新', all: '全部', loading: '正在汇总各站动态…', empty: '暂时还没有动态。',
        status: '更新于 %t · %s 个站点 · %n 条动态', cached: '（缓存）', partial: '部分站点暂不可用：',
        failed: '动态载入失败，请稍后重试。', justnow: '刚刚', hours: '小时前', days: '天前', undated: '未标日期' };

  var SITE_LABEL = {
    teahouse: '茶馆', bookstation: '书栈', pianyu: '片屿', music: '音乐电台', news: '每日要闻'
  };
  var SITE_LABEL_EN = {
    teahouse: 'Teahouse', bookstation: 'BookStation', pianyu: 'Pianyu', music: 'Music', news: 'Daily News'
  };

  if (en) {
    document.getElementById('hTitle').textContent = T.title;
    document.getElementById('hDesc').textContent = T.desc;
    document.getElementById('refreshBtn').textContent = T.refresh;
    document.title = T.title + " · Jerry's webpage";
  }

  var chipsBox = document.getElementById('chips');
  var statusEl = document.getElementById('status');
  var timelineEl = document.getElementById('timeline');
  var refreshBtn = document.getElementById('refreshBtn');
  var allItems = [];
  var curSite = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function label(site) { return (en ? SITE_LABEL_EN : SITE_LABEL)[site] || site; }
  function fmtTime(ts) {
    if (!ts) return T.undated;
    var diff = Date.now() - ts;
    if (diff < 0 || diff > 365 * 86400000) {
      var d = new Date(ts);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    if (diff < 60000) return T.justnow;
    if (diff < 3600000) return Math.floor(diff / 60000) + (en ? ' min ago' : '分钟前');
    if (diff < 86400000) return Math.floor(diff / 3600000) + T.hours;
    return Math.floor(diff / 86400000) + T.days;
  }
  function stamp(iso) {
    try {
      var d = new Date(iso);
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    } catch (e) { return '--:--'; }
  }

  function renderChips() {
    var counts = {};
    allItems.forEach(function (x) { counts[x.site] = (counts[x.site] || 0) + 1; });
    var defs = [{ site: '', text: T.all + ' (' + allItems.length + ')' }];
    Object.keys(SITE_LABEL).forEach(function (s) {
      defs.push({ site: s, text: label(s) + ' (' + (counts[s] || 0) + ')' });
    });
    chipsBox.innerHTML = defs.map(function (d) {
      return '<button type="button" class="chip' + (d.site === curSite ? ' on' : '') + '" data-site="' + d.site + '">' + esc(d.text) + '</button>';
    }).join('');
    Array.prototype.forEach.call(chipsBox.querySelectorAll('.chip'), function (b) {
      b.addEventListener('click', function () { curSite = b.getAttribute('data-site'); renderChips(); renderList(); });
    });
  }

  function renderList() {
    var list = curSite ? allItems.filter(function (x) { return x.site === curSite; }) : allItems;
    if (!list.length) { timelineEl.innerHTML = '<div class="empty">' + T.empty + '</div>'; return; }
    timelineEl.innerHTML = list.map(function (x) {
      var url = /^https?:\/\//i.test(x.url || '') ? x.url : '#';
      return '<a class="tl-item" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<span class="tl-dot s-' + esc(x.site) + '"></span>' +
        '<span class="tl-body">' +
          '<span class="tl-meta"><span class="tl-site">' + esc(label(x.site)) + '</span>' +
          '<span class="tl-kind">' + esc(x.kind || '') + '</span>' +
          '<span>' + esc(fmtTime(x.ts)) + '</span></span>' +
          '<span class="tl-title">' + esc(x.title) + '</span>' +
          (x.desc ? '<span class="tl-desc">' + esc(x.desc) + '</span>' : '') +
        '</span>' +
        '<span class="tl-arrow">↗</span>' +
      '</a>';
    }).join('');
  }

  function load() {
    refreshBtn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = T.loading;
    fetch('/api/activity', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        allItems = (d && Array.isArray(d.items)) ? d.items : [];
        var okSites = Object.keys(d.sources || {}).filter(function (s) { return d.sources[s] > 0; }).length;
        statusEl.textContent = T.status.replace('%t', stamp(d.updated)).replace('%s', String(okSites)).replace('%n', String(allItems.length)) +
          (d.cached ? T.cached : '');
        if (d.errors && d.errors.length) {
          statusEl.className = 'status warn';
          statusEl.textContent += ' · ' + T.partial + d.errors.map(label).join('、');
        }
        renderChips();
        renderList();
      })
      .catch(function () {
        statusEl.className = 'status warn';
        statusEl.textContent = T.failed;
        timelineEl.innerHTML = '<div class="empty">' + T.failed + '</div>';
      })
      .then(function () { refreshBtn.disabled = false; });
  }

  refreshBtn.addEventListener('click', load);
  load();
})();
</script>

</body>
